# Stations known to the monitor.
#
# mode: replay -> frames come from a recording under `recording`
# mode: live   -> frames come from an NTRIP caster (not implemented yet)
#
# Free NTRIP accounts limit the number of simultaneous streams, so keep the
# live list short and scale the station count through replay.
stations:
  - id: SYN100XXX
    mode: replay
    recording: tests/fixtures/SYN100XXX_synthetic.jsonl
    description: Synthetic station generated by gnss_monitor.replay.synthetic
